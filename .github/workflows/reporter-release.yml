name: Reporter Release

on:
  push:
    tags:
      - 'reporter@*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance attestation.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Install dependencies
        run: pnpm install

      - name: Build reporter
        run: pnpm run build:reporter

      - name: Extract version from tag or input
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/reporter@}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Update package.json version
        run: cd packages/reporter && pnpm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      # No token: pnpm exchanges the Actions OIDC token for a short-lived publish token.
      - name: Publish to npm
        run: cd packages/reporter && pnpm publish --provenance --access public --no-git-checks
