name: Helm chart

# Lints and tests the Helm chart on changes; publishes it as an OCI artifact to
# ghcr.io/<owner>/charts on chart tags (chart-v<version>, e.g. chart-v0.1.0).
# Parameterized by the repository owner, so it works unchanged on forks.
on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/helm-chart.yml"
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/helm-chart.yml"
    tags:
      - "chart-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_DIR: charts/playwright-reports-server
  HELM_VERSION: v4.3.0
  HELM_UNITTEST_VERSION: v1.2.1

jobs:
  test:
    name: Lint, unit tests, render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Lint
        run: |
          helm lint "$CHART_DIR" --set auth.apiToken=x --set auth.authSecret=y
          helm lint "$CHART_DIR" --set auth.existingSecret=auth \
            --set storage.type=s3 --set storage.s3.endpoint=s3.example.com --set storage.s3.existingSecret=s3
      - name: Unit tests (helm-unittest)
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "$HELM_UNITTEST_VERSION" --verify=false >/dev/null
          helm unittest "$CHART_DIR"
      - name: Render and validate against the Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template ci "$CHART_DIR" --set auth.apiToken=x --set auth.authSecret=y --set ingress.enabled=true \
            | ./kubeconform -strict -summary
          helm template ci "$CHART_DIR" --set auth.existingSecret=auth \
            --set storage.type=s3 --set storage.s3.endpoint=s3.example.com --set storage.s3.existingSecret=s3 \
            | ./kubeconform -strict -summary
      - name: README is generated from values (helm-docs)
        run: |
          docker run --rm -v "$PWD:/w" -w /w jnorwood/helm-docs:v1.14.2 --chart-search-root charts
          git diff --exit-code -- "$CHART_DIR/README.md" \
            || { echo "::error::README.md is out of date: run helm-docs"; exit 1; }

  publish:
    name: Package & push (OCI)
    if: startsWith(github.ref, 'refs/tags/chart-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Check the tag matches Chart.yaml
        id: prep
        run: |
          version="${GITHUB_REF_NAME#chart-v}"
          chart_version=$(grep -E '^version:' "$CHART_DIR/Chart.yaml" | awk '{print $2}' | tr -d '"')
          if [ "$version" != "$chart_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Chart.yaml version $chart_version"
            exit 1
          fi
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Package
        run: helm package "$CHART_DIR" --destination dist
      - name: Push
        env:
          OWNER: ${{ steps.prep.outputs.owner }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push dist/*.tgz "oci://ghcr.io/$OWNER/charts"
