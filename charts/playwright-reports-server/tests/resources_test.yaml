suite: services and ingress
set:
  auth.apiToken: token
  auth.authSecret: secret
tests:
  - it: exposes port 3001 through the Service
    template: service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 3001

  - it: creates the headless governing Service of the StatefulSet
    template: service.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-playwright-reports-server-headless
      - equal:
          path: spec.clusterIP
          value: None

  - it: creates no Ingress by default
    template: ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: routes the Ingress hosts to the Service
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.className: traefik
      ingress.hosts:
        - host: reports.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - equal:
          path: spec.rules[0].host
          value: reports.example.com
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-playwright-reports-server
