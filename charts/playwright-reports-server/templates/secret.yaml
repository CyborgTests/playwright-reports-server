{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prs.authSecretName" . }}
  labels:
    {{- include "prs.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.apiTokenKey }}: {{ .Values.auth.apiToken | quote }}
  {{ .Values.auth.authSecretKey }}: {{ .Values.auth.authSecret | quote }}
{{- end }}
